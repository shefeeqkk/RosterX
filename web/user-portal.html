<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#EEF2F6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="RosterX" />

  <title>RosterX — Operations &amp; Shift Portal</title>

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Anti-FOUC Theme & 6-Palette Guard -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('rosterx_theme') || 'system';
        var palette = localStorage.getItem('rosterx_palette') || 'tory_blue';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-palette', palette);
        var csMeta = document.querySelector('meta[name="color-scheme"]');
        if (csMeta) csMeta.content = theme === 'system' ? 'light dark' : theme;
        var tcMeta = document.querySelector('meta[name="theme-color"]');
        if (tcMeta) tcMeta.content = isDark ? '#1E293B' : '#EEF2F6';
        document.documentElement.classList.toggle('dark', isDark);
      } catch (e) {}
    })();
  </script>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- RosterX Design System -->
  <link rel="stylesheet" href="css/tokens.css?v=2.0.6" />
  <link rel="stylesheet" href="css/neumorphic.css?v=2.0.6" />
  <link rel="stylesheet" href="css/mobile-shell.css?v=2.3.14" />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--nm-canvas);
      color: var(--nm-text);
      min-height: 100dvh;
    }
    .rx-topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--nm-canvas);
      border-bottom: 1px solid var(--nm-divider);
    }
    .rx-topbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      height: 58px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .rx-brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-inline-size: 0;
    }
    .rx-brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: contain;
    }
    .rx-brand-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--nm-accent);
      letter-spacing: -0.02em;
    }
    .rx-topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .rx-bell-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 999px;
      background: var(--nm-surface);
      box-shadow: var(--nm-shadow-raised-subtle);
      color: #D97706;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .rx-bell-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 999px;
      background: #DC2626;
      color: #fff;
      font-size: 9.5px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--nm-canvas);
    }
    .rx-avatar-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px 4px 5px;
      border: 0;
      border-radius: 999px;
      background: var(--nm-surface);
      box-shadow: var(--nm-shadow-raised-subtle);
      color: var(--nm-text);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .rx-avatar-circle {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--nm-accent-soft);
      color: var(--nm-accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      overflow: hidden;
      flex-shrink: 0;
    }
    .rx-avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Desktop Top Tab Bar */
    .rx-desktop-nav {
      background: var(--nm-surface);
      border-bottom: 1px solid var(--nm-divider);
      position: sticky;
      top: 58px;
      z-index: 35;
    }
    .rx-desktop-nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .rx-desktop-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
    }
    .rx-desktop-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border: 0;
      border-radius: 12px;
      background: var(--nm-surface);
      color: var(--nm-text-muted);
      box-shadow: var(--nm-shadow-raised-subtle);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--nm-transition);
    }
    .rx-desktop-tab-btn.is-active {
      background: var(--nm-accent-gradient);
      color: #fff;
      box-shadow: 0 4px 12px var(--nm-accent-glow);
    }
    main.rx-main-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 16px 32px;
    }
    .rx-hidden { display: none !important; }
    .rx-toast-host {
      position: fixed;
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      width: min(92vw, 420px);
      pointer-events: none;
    }
    .rx-toast {
      padding: 10px 18px;
      border-radius: 9999px;
      background: var(--nm-surface);
      color: var(--nm-text);
      box-shadow: var(--nm-shadow-floating);
      font-size: 13px;
      font-weight: 700;
      border-left: 4px solid var(--nm-accent);
      pointer-events: auto;
      text-align: center;
    }
    .rx-toast.is-success { border-left-color: #10B981; }
    .rx-toast.is-error   { border-left-color: #DC2626; }
    /* Mention Dropdown */
    .rx-mention-popup {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 50;
      background: var(--nm-surface);
      border-radius: 14px;
      box-shadow: var(--nm-shadow-floating);
      max-height: 180px;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .rx-mention-item {
      border: 0;
      background: transparent;
      color: var(--nm-text);
      text-align: left;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }
    .rx-mention-item:hover {
      background: var(--nm-accent-soft);
      color: var(--nm-accent);
    }
    @media (orientation: landscape) and (max-height: 540px) {
      .rx-brand-logo { width: 24px; height: 24px; }
      .rx-brand-title { font-size: 15px; }
      .rx-bell-btn { width: 32px; height: 32px; font-size: 17px; }
      .rx-avatar-pill { padding: 3px 8px 3px 4px; font-size: 11px; }
      .rx-avatar-circle { width: 20px; height: 20px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <!-- Toast Container -->
  <div id="rxToastHost" class="rx-toast-host" aria-live="polite"></div>

  <!-- Top Bar (adapts automatically to 42px slim bar in landscape + iOS notch safe-area) -->
  <header class="rx-topbar rx-topbar-safe no-print">
    <div class="rx-topbar-inner">
      <div class="rx-brand-wrap">
        <button type="button" id="btnSubViewBack" class="rx-icon-pill rx-hidden" aria-label="Back" style="width:34px;height:34px;min-inline-size:34px;min-block-size:34px;">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
        </button>
        <img id="rxBrandLogo" src="assets/logo.png" alt="RosterX Logo" class="rx-brand-logo" />
        <div style="min-inline-size:0;">
          <div id="rxTopBarTitle" class="rx-brand-title">RosterX</div>
        </div>
      </div>

      <div class="rx-topbar-actions" id="rxTopBarActions">
        <button type="button" id="btnOpenNotifications" class="rx-bell-btn" aria-label="Notifications">
          <i class="ph-fill ph-bell-ringing" aria-hidden="true"></i>
          <span id="rxBellBadge" class="rx-bell-badge rx-hidden">0</span>
        </button>
        <button type="button" id="btnOpenProfile" class="rx-avatar-pill" aria-label="Open Profile and Settings">
          <span id="rxTopAvatar" class="rx-avatar-circle">TM</span>
          <span id="rxTopFirstName">Member</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Desktop Navigation Bar (hidden on mobile portrait/landscape where Fluid Neumorphic Nav owns navigation) -->
  <nav id="rxDesktopNav" class="rx-desktop-nav rx-desktop-only-nav no-print" aria-label="Desktop navigation">
    <div class="rx-desktop-nav-inner">
      <div id="rxDesktopTabs" class="rx-desktop-tabs"></div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <span id="rxPortalConnectionPill" style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:var(--nm-input-surface);font-size:11.5px;font-weight:700;color:var(--nm-text-muted);">
          <span style="width:8px;height:8px;border-radius:999px;background:#10B981;"></span>
          <span>Atlas Live</span>
        </span>
        <button type="button" id="btnRefreshPortal" class="rx-btn-surface" style="padding:6px 11px;font-size:12px;">
          <i class="ph ph-arrows-clockwise" aria-hidden="true"></i> Refresh
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content Shell -->
  <main class="rx-main-shell" id="rxMainContainer">
    <!-- Tab Panels (1:1 Android parity — zero Swap Request tab!) -->
    <section id="panel_dashboard" class="rx-tab-panel"></section>
    <section id="panel_team_shifts" class="rx-tab-panel rx-hidden"></section>
    <section id="panel_my_calendar" class="rx-tab-panel rx-hidden"></section>
    <section id="panel_month_roster" class="rx-tab-panel rx-hidden"></section>
    <section id="panel_broadcast" class="rx-tab-panel rx-hidden"></section>
    <section id="panel_more" class="rx-tab-panel rx-hidden"></section>

    <!-- Full-View Subscreens (Credential Tracker, My Team, Profile & Settings) -->
    <section id="subview_credentials" class="rx-subview rx-hidden"></section>
    <section id="subview_my_team" class="rx-subview rx-hidden"></section>
    <section id="subview_profile" class="rx-subview rx-hidden"></section>
  </main>

  <!-- Floating AI Assistant Button (Dashboard Landing Tab Only) -->
  <button type="button" id="btnRosterAiFab" class="rx-ai-fab" aria-label="RosterX AI Assistant" style="border:0;background:transparent;padding:0;cursor:pointer;width:54px;height:54px;">
    <img src="assets/bot-3d-cutout.png" alt="RosterX AI" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(15,23,42,0.22));" />
  </button>

  <!-- Floating Jump to Today FAB (Team Shifts Tab when viewing a non-today date — Android 1:1 Parity) -->
  <button type="button" id="btnJumpTodayFab" class="rx-today-fab rx-hidden" aria-label="Jump to Today">
    <i class="ph ph-calendar-check" style="font-size:18px;" aria-hidden="true"></i>
    <span>Jump to Today</span>
  </button>

  <!-- Native Frosted <dialog> Overlays -->
  <dialog id="rxNotificationsDialog" class="rx-modal" closedby="any" aria-labelledby="rxNotifDialogTitle"></dialog>
  <dialog id="rxCelebrationDialog" class="rx-modal" closedby="any" aria-labelledby="rxCelebDialogTitle"></dialog>
  <dialog id="rxEditProfileDialog" class="rx-modal" closedby="any" aria-labelledby="rxEditProfileTitle"></dialog>
  <dialog id="rxConfirmRemovePhotoDialog" class="rx-modal" closedby="any" aria-labelledby="rxRemovePhotoTitle"></dialog>

  <script type="module" src="js/userPortal.js?v=2.3.18"></script>
</body>
</html>
